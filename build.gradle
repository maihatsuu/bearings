plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'TerraformersMC' // Trinkets
		url = 'https://maven.terraformersmc.com/'
		content { includeGroup 'dev.emi' }
	}
	maven {
		name = 'Ladysnake' // Cardinal Components, required by Trinkets
		url = 'https://maven.ladysnake.org/releases'
		content { includeGroupAndSubgroups 'org.ladysnake' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth' // BetterF3
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bearings" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations: compiled against, never bundled or required.
	modCompileOnly("dev.emi:trinkets:${project.trinkets_version}") { exclude group: 'net.fabricmc.fabric-api' }
	modCompileOnly "maven.modrinth:betterf3:${project.betterf3_version}"

	// Pass -PnoCompat to test in a dev environment without them, or -PnoBetterF3 to drop only BetterF3.
	if (!project.hasProperty('noCompat')) {
		modLocalRuntime("dev.emi:trinkets:${project.trinkets_version}") { exclude group: 'net.fabricmc.fabric-api' }
		if (!project.hasProperty('noBetterF3')) {
			modLocalRuntime "maven.modrinth:betterf3:${project.betterf3_version}"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
